name: Security & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Audit, Type Check, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies with exact lockfile
        run: npm ci

      - name: Run security audit (High & Critical check)
        run: npm audit --audit-level=high

      - name: Run Type Check & Lint
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify static build output
        run: |
          test -f build/index.html || exit 1
          test -f build/assets/Sagnik_resume.pdf || exit 1
          test -f build/_headers || exit 1
          test -f build/.well-known/security.txt || exit 1
          echo "Build verification passed: all artifacts and security files present."

